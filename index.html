<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0f1a;--surface:#111827;--border:#1e2d45;
  --text:#c8d8f0;--muted:#4a6080;
}
body{
  background:var(--bg);color:var(--text);
  font-family:'Courier New',Courier,monospace;
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;padding:28px 12px 48px;
}
h1{
  font-family:Georgia,'Times New Roman',serif;
  font-weight:300;font-size:clamp(1.3rem,3vw,2rem);
  letter-spacing:.04em;color:#e8d8a0;text-align:center;
}
h1 b{font-weight:700}
p.sub{
  margin-top:6px;font-size:.68rem;color:var(--muted);
  letter-spacing:.12em;text-transform:uppercase;text-align:center;
}
#wrap{
  width:100%;max-width:1120px;background:var(--surface);
  border:1px solid var(--border);border-radius:4px;
  padding:24px 12px 16px;margin-top:28px;
}
svg{display:block;width:100%;overflow:visible}
#legend{
  display:flex;flex-wrap:wrap;gap:8px 20px;
  margin-top:18px;justify-content:center;padding:0 8px;
}
.li{
  display:flex;align-items:center;gap:6px;font-size:.68rem;
  color:var(--text);cursor:pointer;padding:3px 6px;border-radius:3px;
  border:1px solid transparent;transition:border-color .15s;
}
.li:hover{border-color:#2a3f5f}
.li.sel{border-color:#4a7fa0;background:#0d1829}
.ls{width:24px;height:4px;border-radius:2px;flex-shrink:0}
/* Tooltip — shown on hover & click */
#tt{
  position:fixed;pointer-events:none;
  background:#0a1220f0;border:1px solid #2a3f5f;
  border-radius:5px;padding:11px 15px;font-size:.68rem;
  line-height:1.8;color:var(--text);z-index:100;
  display:none;min-width:220px;max-width:300px;
  box-shadow:0 4px 24px #000a;
}
.tt-t{color:#e8d8a0;font-size:.84rem;font-family:Georgia,serif;margin-bottom:3px}
.tt-sect{color:#4a90d0;font-size:.6rem;letter-spacing:.1em;margin-top:6px;margin-bottom:1px}
.tt-time-row{display:flex;justify-content:space-between;gap:12px}
.tt-now{color:#22d3a0}
/* SVG path cursor */
.zman-lane{cursor:pointer}

   start:hmsToMs(ZMANIM_RAW.plagHamincha),  end:hmsToMs(ZMANIM_RAW.tzet),               side:'sun',  lane:2},
  {id:'maariv',    label:'Maariv',            he:'מעריב',           color:'#818cf8',
   start:hmsToMs(ZMANIM_RAW.tzet),          end:hmsToMs(ZMANIM_RAW.tzet72),             side:'moon', lane:0},
];

// HELPERS
// ══════════════════════════════════════════════════════════════════════════════
const SVG_NS='http://www.w3.org/2000/svg';
function el(tag,attrs={},parent=null){
  const e=document.createElementNS(SVG_NS,tag);
  for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);
  if(parent)parent.appendChild(e);
  return e;
}
function scale(d0,d1,r0,r1){ return v=>r0+(v-d0)/(d1-d0)*(r1-r0); }

function msToLocalStr(ms){
  const d=new Date(ms+3*3600000);
  return String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0');
}
function msToHalachic(ms){
  const halH=(ms-NETZ_MS)/SHAAH_MS;
  if(halH<-1.5||halH>13.5)return '—';
  const sign=halH<0?'−':'';
  const abs=Math.abs(halH);
  const h=Math.floor(abs);
  const m=Math.round((abs-h)*60);
  return sign+'שעה '+h+(m>0?' '+m+"'":'');
}

// Catmull-Rom path
function crPath(pts){
  if(pts.length<2)return '';
  let d='M'+pts[0].x.toFixed(1)+','+pts[0].y.toFixed(1);
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];
    const t0=0,t1=t0+Math.hypot(p1.x-p0.x,p1.y-p0.y)**.5,
          t2=t1+Math.hypot(p2.x-p1.x,p2.y-p1.y)**.5,
          t3=t2+Math.hypot(p3.x-p2.x,p3.y-p2.y)**.5;
    for(let k=1;k<=6;k++){
      const t=t1+(t2-t1)*k/6;
      const l=(a,b,ta,tb)=>ta===tb?{x:a.x,y:a.y}:{x:a.x+(t-ta)/(tb-ta)*(b.x-a.x),y:a.y+(t-ta)/(tb-ta)*(b.y-a.y)};
      const a1=l(p0,p1,t0,t1),a2=l(p1,p2,t1,t2),a3=l(p2,p3,t2,t3);
      const b1=l(a1,a2,t0,t2),b2=l(a2,a3,t1,t3);
      const c=l(b1,b2,t1,t2);
      d+='L'+c.x.toFixed(1)+','+c.y.toFixed(1);
    }
  }
  return d;
}

// STATE

let selectedId=null;       // currently selected lane id (or 'now')
let lanePaths={};          // id → SVG path element
let nowLineEl=null;        // the "now" vertical line element
let nowLineHitEl=null;     // wide invisible hit target for "now" line
let iW_global=0,iH_global=0,xS_global=null,yS_global=null,g_global=null;
const MARGIN={top:62,right:54,bottom:74,left:62};
const LANE_W=5,LANE_GAP=2;
const LANE_W_SEL=9;        // selected lane stroke-width

// ══════════════════════════════════════════════════════════════════════════════
// TOOLTIP
// ══════════════════════════════════════════════════════════════════════════════
const tt=document.getElementById('tt');
let ttPinned=false;   // true when shown by click (stays visible)

function positionTt(clientX,clientY){
  const vpW=window.innerWidth,vpH=window.innerHeight;
  const ttW=tt.offsetWidth||240,ttH=tt.offsetHeight||120;
  let lx=clientX+16,ly=clientY-12;
  if(lx+ttW>vpW-8)lx=clientX-ttW-12;
  if(ly+ttH>vpH-8)ly=clientY-ttH-12;
  if(ly<8)ly=8;
  tt.style.left=lx+'px';tt.style.top=ly+'px';
}

function showHoverTt(ms,clientX,clientY){
  if(ttPinned)return; // don't override a pinned click tooltip
  const m=Math.max(0,Math.min(1439,Math.round((ms-DAY_START_MS)/60000)));
  const d=DATA[m];
  const active=ZMANIM_WINDOWS.filter(z=>d.ms>=z.start&&d.ms<=z.end);
  let html=`<div class="tt-t">${msToLocalStr(d.ms)} IDT&nbsp;·&nbsp;${msToHalachic(d.ms)}</div>`
    +`<div>☀ Sun: <b>${d.sunAlt.toFixed(1)}°</b>&nbsp;&nbsp;☽ Moon: <b>${d.moonAlt.toFixed(1)}°</b></div>`;
  if(active.length){
    html+=`<div class="tt-sect">ACTIVE ZMANIM</div>`;
    active.forEach(z=>{html+=`<div style="color:${z.color}">▸ ${z.label} · ${z.he}</div>`;});
  } else {
    html+=`<div style="color:#4a6080;font-size:.63rem;margin-top:4px">No active zman</div>`;
  }
  tt.innerHTML=html;tt.style.display='block';
  positionTt(clientX,clientY);
}

function showZmanTt(z,clientX,clientY){
  const startGeo=msToLocalStr(z.start),endGeo=msToLocalStr(z.end);
  const startHal=msToHalachic(z.start),endHal=msToHalachic(z.end);
  const durationMs=z.end-z.start;
  const dMin=Math.round(durationMs/60000);
  const dH=Math.floor(dMin/60),dM=dMin%60;
  const durStr=dH>0?`${dH}h ${dM}m`:`${dM}m`;
  const html=`<div class="tt-t" style="color:${z.color}">${z.label} &nbsp;·&nbsp; <span style="font-size:.7rem;color:#c8d8f0;">${z.he}</span></div>`
    +`<div class="tt-sect">START</div>`
    +`<div class="tt-time-row"><span>🕐 ${startGeo} IDT</span><span style="color:#a0c8a0">${startHal}</span></div>`
    +`<div class="tt-sect">END</div>`
    +`<div class="tt-time-row"><span>🕐 ${endGeo} IDT</span><span style="color:#a0c8a0">${endHal}</span></div>`
    +`<div class="tt-sect">DURATION</div>`
    +`<div>${durStr}</div>`;
  tt.innerHTML=html;tt.style.display='block';
  positionTt(clientX,clientY);
}

function showNowTt(clientX,clientY){
  const nowMs=Date.now();
  // Snap to day — show what's active now if it's 16 June 2026, else show current wall time
  const msForDay=DAY_START_MS+((nowMs-DAY_START_MS+DAY_SPAN_MS)%DAY_SPAN_MS);
  const m=Math.max(0,Math.min(1439,Math.round((msForDay-DAY_START_MS)/60000)));
  const d=DATA[m];
  const active=ZMANIM_WINDOWS.filter(z=>d.ms>=z.start&&d.ms<=z.end);
  // Real local wall clock
  const wall=new Date();
  const wallStr=String(wall.getHours()).padStart(2,'0')+':'+String(wall.getMinutes()).padStart(2,'0');
  let html=`<div class="tt-t tt-now">▶ Current Time — ${wallStr}</div>`
    +`<div style="font-size:.63rem;color:#4a6080">Showing chart position for this time on 16 Jun 2026</div>`
    +`<div style="margin-top:4px">☀ Sun: <b>${d.sunAlt.toFixed(1)}°</b>&nbsp;&nbsp;☽ Moon: <b>${d.moonAlt.toFixed(1)}°</b></div>`
    +`<div style="margin-top:2px">${msToHalachic(d.ms)}</div>`;
  if(active.length){
    html+=`<div class="tt-sect">ACTIVE ZMANIM</div>`;
    active.forEach(z=>{html+=`<div style="color:${z.color}">▸ ${z.label} · ${z.he}</div>`;});
  } else {
    html+=`<div style="color:#4a6080;font-size:.63rem;margin-top:4px">No active zman</div>`;
  }
  tt.innerHTML=html;tt.style.display='block';
  positionTt(clientX,clientY);
}

function hideTt(){
  if(ttPinned)return;
  tt.style.display='none';
}

function dismissPin(evt){
  // Clicking empty area dismisses pinned tooltip and deselects
  if(ttPinned){
    ttPinned=false;
    tt.style.display='none';
    deselectAll();
  }
}

function deselectAll(){
  selectedId=null;
  // Reset all lane widths
  Object.entries(lanePaths).forEach(([id,path])=>{
    const z=ZMANIM_WINDOWS.find(z=>z.id===id);
    if(z)path.setAttribute('stroke-width',LANE_W);
  });
  if(nowLineEl){
    nowLineEl.setAttribute('stroke-width',2);
    nowLineEl.setAttribute('stroke','#22d3a055');
  }
  // Legend items
  document.querySelectorAll('.li').forEach(li=>li.classList.remove('sel'));
}

function selectLane(id,clientX,clientY){
  deselectAll();
  selectedId=id;
  ttPinned=true;
  if(id==='now'){
    if(nowLineEl){
      nowLineEl.setAttribute('stroke-width',4);
      nowLineEl.setAttribute('stroke','#22d3a0cc');
    }
    showNowTt(clientX,clientY);
    // highlight legend item
    document.querySelectorAll('.li[data-id="now"]').forEach(li=>li.classList.add('sel'));
  } else {
    const path=lanePaths[id];
    if(path)path.setAttribute('stroke-width',LANE_W_SEL);
    const z=ZMANIM_WINDOWS.find(z=>z.id===id);
    if(z)showZmanTt(z,clientX,clientY);
    document.querySelectorAll(`.li[data-id="${id}"]`).forEach(li=>li.classList.add('sel'));
  }
}

// ══════════════════════════════════════════════════════════════════════════════
// NOW LINE — computed from current wall clock mapped to chart day
// ══════════════════════════════════════════════════════════════════════════════
function getNowMs(){
  const now=new Date();
  // map current IDT wall time → chart ms (on 2026-06-16)
  const h=now.getHours(),m=now.getMinutes(),s=now.getSeconds();
  return hmsToMs([h,m,s]);
}

function updateNowLine(){
  if(!nowLineEl||!xS_global)return;
  const x=xS_global(getNowMs());
  nowLineEl.setAttribute('x1',x);nowLineEl.setAttribute('x2',x);
  if(nowLineHitEl){nowLineHitEl.setAttribute('x1',x);nowLineHitEl.setAttribute('x2',x);}
}

// ══════════════════════════════════════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════════════════════════════════════
function render(){
  const wrap=document.getElementById('wrap');
  const W=wrap.clientWidth-24;
  const H=Math.max(440,Math.round(W*0.48));
  const iW=W-MARGIN.left-MARGIN.right;
  const iH=H-MARGIN.top-MARGIN.bottom;
  iW_global=iW;iH_global=iH;

  const svg=document.getElementById('chart');
  svg.innerHTML='';
  lanePaths={};nowLineEl=null;nowLineHitEl=null;

  svg.setAttribute('width',W);svg.setAttribute('height',H);
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);

  const g=el('g',{transform:`translate(${MARGIN.left},${MARGIN.top})`},svg);
  g_global=g;

  const xS=scale(DAY_START_MS,DAY_END_MS,0,iW);
  const yS=scale(Y_BOT,Y_TOP,iH,0);
  xS_global=xS;yS_global=yS;
  const horizon=yS(0);

  // ── Defs ──
  const defs=el('defs',{},svg);

  // Sky gradient
  const skyG=el('linearGradient',{id:'skyG',x1:'0%',x2:'100%'},defs);
  function toPct(h,m){return((Date.UTC(2026,5,16,h-3,m)-DAY_START_MS)/DAY_SPAN_MS*100).toFixed(1)+'%';}
  [[0,'#08090f'],[toPct(4,5),'#1a0f2e'],[toPct(4,33),'#2d1a4a'],
   [toPct(5,20),'#7c4a1e'],[toPct(7,0),'#4a90c8'],[toPct(12,0),'#5ba3d8'],
   [toPct(16,0),'#4a90c8'],[toPct(18,30),'#c27820'],[toPct(19,30),'#8a2c0a'],
   [toPct(20,15),'#2a1a3e'],['100%','#08090f']
  ].forEach(([off,col])=>{const s=el('stop',{offset:off},skyG);s.setAttribute('stop-color',col);});
  el('rect',{x:0,y:0,width:iW,height:iH,fill:'url(#skyG)',opacity:.5},g);

  // Path gradients
  const sunG=el('linearGradient',{id:'sunG',x1:'0%',x2:'100%'},defs);
  [['0%','#4c3a6e'],['18%','#c87828'],['45%','#f5c842'],['80%','#f5a020'],['100%','#6e3a26']]
    .forEach(([o,c])=>{const s=el('stop',{offset:o},sunG);s.setAttribute('stop-color',c);});
  const moonG=el('linearGradient',{id:'moonG',x1:'0%',x2:'100%'},defs);
  [['0%','#2c4a6e'],['50%','#8ab4d8'],['100%','#3a608e']]
    .forEach(([o,c])=>{const s=el('stop',{offset:o},moonG);s.setAttribute('stop-color',c);});

  // Glow filter
  const filt=el('filter',{id:'glow'},defs);
  el('feGaussianBlur',{in:'SourceGraphic',stdDeviation:'2.5',result:'b'},filt);
  const fm=el('feMerge',{},filt);
  el('feMergeNode',{in:'b'},fm);el('feMergeNode',{in:'SourceGraphic'},fm);

  // Clip
  const clip=el('clipPath',{id:'chartClip'},defs);
  el('rect',{x:0,y:0,width:iW,height:iH},clip);

  // ── Grid lines — every 15° ──
  for(let v=Y_BOT;v<=Y_TOP;v+=15){
    if(v===0)continue;
    el('line',{x1:0,x2:iW,y1:yS(v),y2:yS(v),stroke:'#1e2d45','stroke-dasharray':'2 4','stroke-width':1},g);
  }

  // ── Horizon ──
  el('line',{x1:0,x2:iW,y1:horizon,y2:horizon,stroke:'#4a7fa0','stroke-width':1.5,'stroke-dasharray':'6 4'},g);
  const htxt=el('text',{x:iW+5,y:horizon+4,fill:'#4a7fa0','font-size':9},g);
  htxt.textContent='0°';

  // ── Sun/moon peak annotation lines ──
  const sunPeakY=yS(81.6);
  el('line',{x1:0,x2:iW,y1:sunPeakY,y2:sunPeakY,stroke:'#f5c84220','stroke-dasharray':'1 5'},g);
  const sunPeakT=el('text',{x:iW+5,y:sunPeakY+4,fill:'#f5c84260','font-size':8},g);
  sunPeakT.textContent='81.6°';
  const moonPeakY=yS(-85.6);
  el('line',{x1:0,x2:iW,y1:moonPeakY,y2:moonPeakY,stroke:'#8ab4d820','stroke-dasharray':'1 5'},g);
  const moonPeakT=el('text',{x:iW+5,y:moonPeakY+4,fill:'#8ab4d860','font-size':8},g);
  moonPeakT.textContent='−85.6°';

  // ── Zman marker verticals ──
  const MARKERS=[
    {key:'alotHashachar',abbr:'Alot'},{key:'netz',abbr:'Netz'},
    {key:'chatzot',abbr:'Chatzot'},{key:'plagHamincha',abbr:'Plag'},
    {key:'shkia',abbr:'Shkia'},{key:'tzet',abbr:'Tzet'},
  ];
  MARKERS.forEach(mk=>{
    const x=xS(hmsToMs(ZMANIM_RAW[mk.key]));
    el('line',{x1:x,x2:x,y1:0,y2:iH,stroke:'#ffffff18','stroke-width':1,'stroke-dasharray':'3 6'},g);
    const t=el('text',{x:x,y:-14,'text-anchor':'middle',fill:'#c8d8f055','font-size':8.5},g);
    t.textContent=mk.abbr;
  });

  // ── Sun path ──
  const sunPts=[],moonPts=[];
  for(let m=0;m<1440;m+=2){
    const d=DATA[m];
    sunPts.push({x:xS(d.ms),y:yS(d.sunAlt)});
    moonPts.push({x:xS(d.ms),y:yS(-Math.abs(d.moonAlt))});
  }
  el('path',{fill:'none',stroke:'url(#sunG)','stroke-width':3,filter:'url(#glow)',
    'clip-path':'url(#chartClip)',d:crPath(sunPts)},g);
  el('path',{fill:'none',stroke:'url(#moonG)','stroke-width':2,'stroke-dasharray':'6 3',
    opacity:.7,'clip-path':'url(#chartClip)',d:crPath(moonPts)},g);

  const mlt=el('text',{x:6,y:yS(-89),fill:'#8ab4d8','font-size':8.5,opacity:.6},g);
  mlt.textContent='↓ Moon altitude (mirrored)';

  // ── Zmanim lanes ──
  ZMANIM_WINDOWS.forEach(z=>{
    const offset=(LANE_W+LANE_GAP)*(z.lane+1)*(z.side==='sun'?1:-1);
    const sign=z.side==='sun'?-1:1;
    const pts=[];
    for(let m=0;m<1440;m+=2){
      const d=DATA[m];
      if(d.ms<z.start||d.ms>z.end)continue;
      const baseY=z.side==='sun'?yS(d.sunAlt):yS(-Math.abs(d.moonAlt));
      pts.push({x:xS(d.ms),y:baseY+sign*offset});
    }
    if(pts.length<2)return;
    const path=el('path',{fill:'none',stroke:z.color,'stroke-width':LANE_W,'stroke-linecap':'round',
      opacity:.9,'clip-path':'url(#chartClip)',d:crPath(pts),cursor:'pointer',class:'zman-lane'},g);
    lanePaths[z.id]=path;
    // End dot
    const lp=pts[pts.length-1];
    el('circle',{cx:lp.x,cy:lp.y,r:3.5,fill:z.color,opacity:.9},g);
    // Wide invisible hit area (for easier clicking)
    const hitPath=el('path',{fill:'none',stroke:'transparent','stroke-width':18,
      'clip-path':'url(#chartClip)',d:crPath(pts),cursor:'pointer'},g);
    hitPath.addEventListener('click',evt=>{
      evt.stopPropagation();
      if(selectedId===z.id){deselectAll();ttPinned=false;tt.style.display='none';return;}
      selectLane(z.id,evt.clientX,evt.clientY);
    });
    hitPath.addEventListener('mousemove',evt=>{
      if(ttPinned&&selectedId===z.id)return;
      if(!ttPinned)showZmanTt(z,evt.clientX,evt.clientY);
    });
  });

  // ── NOW line ──
  const nowMs=getNowMs();
  const nowX=xS(nowMs);
  // Glowing visible line
  nowLineEl=el('line',{
    x1:nowX,x2:nowX,y1:0,y2:iH,
    stroke:'#22d3a055','stroke-width':2,'stroke-dasharray':'4 3',
    'clip-path':'url(#chartClip)'
  },g);
  // Top label
  const nowLabel=el('text',{x:nowX,y:-5,'text-anchor':'middle',fill:'#22d3a0aa','font-size':9},g);
  nowLabel.textContent='Now';
  // Wide hit area for clicking
  nowLineHitEl=el('line',{
    x1:nowX,x2:nowX,y1:0,y2:iH,
    stroke:'transparent','stroke-width':16,cursor:'pointer',
    'clip-path':'url(#chartClip)'
  },g);
  nowLineHitEl.addEventListener('click',evt=>{
    evt.stopPropagation();
    if(selectedId==='now'){deselectAll();ttPinned=false;tt.style.display='none';return;}
    selectLane('now',evt.clientX,evt.clientY);
  });
  nowLineHitEl.addEventListener('mousemove',evt=>{
    if(ttPinned&&selectedId==='now')return;
    if(!ttPinned)showNowTt(evt.clientX,evt.clientY);
  });

  // ── Bottom X axis ──
  const axBot=el('g',{transform:`translate(0,${iH})`},g);
  el('line',{x1:0,x2:iW,y1:0,y2:0,stroke:'#1e2d45'},axBot);
  for(let h=0;h<24;h+=2){
    const ms=Date.UTC(2026,5,16,h-3,0,0);
    const x=xS(ms);if(x<0||x>iW)continue;
    el('line',{x1:x,x2:x,y1:0,y2:5,stroke:'#4a6080'},axBot);
    const t=el('text',{x:x,y:18,'text-anchor':'middle',fill:'#4a6080','font-size':9},axBot);
    t.textContent=String(h).padStart(2,'0')+':00';
  }
  const xLB=el('text',{x:iW/2,y:50,'text-anchor':'middle',fill:'#4a6080','font-size':9,'letter-spacing':'.1em'},axBot);
  xLB.textContent='GREGORIAN TIME (IDT · UTC+3)';

  // ── Top X axis — Halachic sha'ot ──
  const axTop=el('g',{},g);
  el('line',{x1:0,x2:iW,y1:0,y2:0,stroke:'#1e2d45'},axTop);
  const alotX=xS(hmsToMs(ZMANIM_RAW.alotHashachar));
  el('line',{x1:alotX,x2:alotX,y1:0,y2:-4,stroke:'#4a6080'},axTop);
  const alotT=el('text',{x:alotX,y:-6,'text-anchor':'middle',fill:'#4a6080','font-size':8.5},axTop);
  alotT.textContent='Alot';
  for(let i=0;i<=12;i++){
    const ms=NETZ_MS+i*SHAAH_MS;const x=xS(ms);if(x<0||x>iW)continue;
    el('line',{x1:x,x2:x,y1:0,y2:-4,stroke:'#4a6080'},axTop);
    const t=el('text',{x:x,y:-7,'text-anchor':'middle',fill:'#4a6080','font-size':8},axTop);
    t.textContent=i+'h';
  }
  const tzetX=xS(hmsToMs(ZMANIM_RAW.tzet));
  el('line',{x1:tzetX,x2:tzetX,y1:0,y2:-4,stroke:'#4a6080'},axTop);
  const tzetT=el('text',{x:tzetX,y:-6,'text-anchor':'middle',fill:'#4a6080','font-size':8.5},axTop);
  tzetT.textContent='Tzet';
  const xLT=el('text',{x:iW/2,y:-36,'text-anchor':'middle',fill:'#4a6080','font-size':9,'letter-spacing':'.1em'},g);
  xLT.textContent="SHA'OT ZMANIYOT (HALACHIC HOURS · GRA)";
  const ann=el('text',{x:iW/2,y:-22,'text-anchor':'middle',fill:'#6a8aaa','font-size':8.5,'letter-spacing':'.06em'},g);
  ann.textContent="Sha'ah Zmanit = 71 min · Jerusalem 31.77°N 35.21°E · Elev. 754m";

  // ── Y axis — dynamic ticks every 15° within Y_BOT..Y_TOP ──
  const axY=el('g',{},g);
  el('line',{x1:0,x2:0,y1:0,y2:iH,stroke:'#1e2d45'},axY);
  for(let v=Math.ceil(Y_BOT/15)*15;v<=Y_TOP;v+=15){
    const y=yS(v);
    el('line',{x1:0,x2:-4,y1:y,y2:y,stroke:'#4a6080'},axY);
    const t=el('text',{x:-8,y:y+3.5,'text-anchor':'end',fill:'#4a6080','font-size':9},axY);
    t.textContent=(v===0?'0°':(v>0?'+'+v+'°':v+'°'));
  }
  const yLab=el('text',{transform:`translate(-46,${iH/2}) rotate(-90)`,
    'text-anchor':'middle',fill:'#4a6080','font-size':9,'letter-spacing':'.08em'},g);
  yLab.textContent='ALTITUDE (°)  ↑ SUN  ·  ↓ MOON';

  // ── Hover overlay (for hover tooltip over background) ──
  const overlay=el('rect',{x:0,y:0,width:iW,height:iH,fill:'transparent',cursor:'crosshair'},g);
  const cursor=el('line',{x1:0,x2:0,y1:0,y2:iH,stroke:'#ffffff30','stroke-width':1,display:'none'},g);

  overlay.addEventListener('mousemove',evt=>{
    if(ttPinned)return;
    const svgRect=svg.getBoundingClientRect();
    const cx=evt.clientX-svgRect.left-MARGIN.left;
    if(cx<0||cx>iW){cursor.setAttribute('display','none');hideTt();return;}
    cursor.setAttribute('x1',cx);cursor.setAttribute('x2',cx);cursor.setAttribute('display','');
    const ms=DAY_START_MS+(cx/iW)*DAY_SPAN_MS;
    showHoverTt(ms,evt.clientX,evt.clientY);
  });
  overlay.addEventListener('mouseleave',()=>{
    cursor.setAttribute('display','none');
    hideTt();
  });
  overlay.addEventListener('click',evt=>{dismissPin(evt);});

  // ── Legend ──
  const leg=document.getElementById('legend');leg.innerHTML='';
  // "Now" legend item
  const nowItem=document.createElement('div');
  nowItem.className='li';nowItem.setAttribute('data-id','now');
  nowItem.innerHTML='<div class="ls" style="background:#22d3a0;border:1px dashed #22d3a0"></div>'
    +'<span>Now <span style="opacity:.45;font-size:.6rem">current time</span></span>';
  nowItem.addEventListener('click',evt=>{
    if(selectedId==='now'){deselectAll();ttPinned=false;tt.style.display='none';return;}
    selectLane('now',evt.clientX,evt.clientY);
  });
  leg.appendChild(nowItem);
  // Curve legends
  [{color:'#f5c842',label:'Sun altitude',id:'sun'},{color:'#8ab4d8',label:'Moon altitude (mirrored)',id:'moon'}]
    .forEach(z=>{
      const d=document.createElement('div');d.className='li';
      d.innerHTML=`<div class="ls" style="background:${z.color}"></div><span>${z.label}</span>`;
      leg.appendChild(d);
    });
  // Zman legend items
  ZMANIM_WINDOWS.forEach(z=>{
    const d=document.createElement('div');d.className='li';d.setAttribute('data-id',z.id);
    d.innerHTML=`<div class="ls" style="background:${z.color}"></div>`
      +`<span>${z.label} <span style="opacity:.45;font-size:.6rem">${z.he}</span></span>`;
    d.addEventListener('click',evt=>{
      if(selectedId===z.id){deselectAll();ttPinned=false;tt.style.display='none';return;}
      selectLane(z.id,evt.clientX,evt.clientY);
    });
    d.addEventListener('mouseover',evt=>{
      if(ttPinned)return;
      showZmanTt(z,evt.clientX,evt.clientY);
    });
    d.addEventListener('mouseleave',()=>{ if(!ttPinned)tt.style.display='none'; });
    leg.appendChild(d);
  });
}

render();
window.addEventListener('resize',render);
// Update now line every 60s
setInterval(updateNowLine,60000);
// Dismiss pinned tooltip on Escape
document.addEventListener('keydown',evt=>{
  if(evt.key==='Escape'&&ttPinned){ttPinned=false;tt.style.display='none';deselectAll();}
});
</script>
</body>
</html>
